function tone(at,f,dur,type,vol,f2){const c=AC;if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,at);if(f2)o.frequency.exponentialRampToValueAtTime(f2,at+dur);
 g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(vol||.3,at+.01);g.gain.exponentialRampToValueAtTime(.0001,at+dur);o.connect(g).connect(master);o.start(at);o.stop(at+dur+.02);}

  if(hide!==T.hid){T.hid=hide;treeT.setMatrixAt(i,hide?M0:T.m1);treeC.setMatrixAt(i,hide?M0:T.m2);ch=true;}}

function makeStick(o){

 const man=new THREE.Group(),root=new THREE.Group();man.add(root);
 const hip=new THREE.Group();root.add(hip);
 const w=o.w||1;
 const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.55,8,16),M);torso.position.y=.38;torso.scale.set(w,1,w);hip.add(torso);
 const neck=new THREE.Group();neck.position.y=.75;hip.add(neck);
 const head=new THREE.Mesh(GEO.sph,M);head.scale.setScalar(.24);head.position.y=.2;neck.add(head);
 const limb=len=>{const g=new THREE.Group();const m=new THREE.Mesh(new THREE.CapsuleGeometry(.065,len,6,10),M);m.position.y=-len/2;g.add(m);return g;};
 const armL=limb(.6),armR=limb(.6);armL.position.set(-.2*w,.68,0);armR.position.set(.2*w,.68,0);hip.add(armL,armR);
 const legL=limb(.8),legR=limb(.8);legL.position.set(-.1*w,0,0);legR.position.set(.1*w,0,0);hip.add(legL,legR);
 const hand=new THREE.Group();hand.position.y=-.68;armR.add(hand);
 if(o.hat)addHat(neck,o.hat,o.hc);
 if(o.tie){const tie=mesh(GEO.box,STD(o.tie),.07,.32,.02,0,.48,.14*w);hip.add(tie);}

}

// ===== 打ったあとの流れ（時刻 t を入れると、その瞬間の場面になる） =====
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const lerp=(a,b,u)=>a+(b-a)*u;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ease=u=>u<.5?2*u*u:1-2*(1-u)*(1-u);
const BR=.06;
let PL=null; // いまの一打
let ballShrink=1;
function segOf(P,t){const S=P.segs;for(let i=0;i<S.length;i++){const s=S[i];if(t<s.t0+s.d||i===S.length-1)return {i,k:s.k,u:clamp((t-s.t0)/Math.max(1e-6,s.d),0,1),s};}return null;}
function segByK(P,k){return P.segs.find(s=>s.k===k);}
// 打ったあとの球（理由が起きる前）
function physPos(P,t){
 if(P.c===0){const r=P.roll,tt=Math.min(t,r.stopT),s=P.v*tt-SG.DECEL*tt*tt/2;let y=BR;
  if(P.water&&t>r.stopT){const k=clamp((t-r.stopT)/.5,0,1);return V3(P.dx*(s+.4*k),BR-.3*k,P.dz*(s+.4*k));}

 const f=P.fl;if(t<=f.tl){const h=f.vh*t;return V3(P.dx*h,BR+f.vy*t-SG.G*t*t/2,P.dz*h);}
 const lx=P.dx*f.carry,lz=P.dz*f.carry;
 if(P.water){const k=clamp((t-f.tl)/.5,0,1);return V3(lx,BR-.3*k,lz);}
 const u=clamp((t-f.tl)/.6,0,1);return V3(lerp(lx,P.rest.x,u),BR+Math.sin(Math.PI*u)*.35,lerp(lz,P.rest.z,u));
}
function cupPos(P,t){
 if(P.type!=='cupmove')return V3(CUP.x,0,CUP.z);
 const s=segByK(P,'move');if(!s||t<s.t0)return V3(CUP.x,0,CUP.z);const u=ease(clamp((t-s.t0)/s.d,0,1));return V3(lerp(CUP.x,P.E.x,u),0,lerp(CUP.z,P.E.z,u));

 const E=V3(P.E.x,P.E.y,P.E.z),C=V3(CUP.x,0,CUP.z);let ux=C.x-E.x,uz=C.z-E.z;const L=Math.hypot(ux,uz)||1;ux/=L;uz/=L;
 const side=P.j>1?1:-1,nx=-uz*side,nz=ux*side;
 const Lo={E,ux,uz,nx,nz};
 const da=P.da||6;
 Lo.A0=V3(E.x+nx*da*.8-ux*da*.6,0,E.z+nz*da*.8-uz*da*.6);

 if(hdn.moved){slid=Math.max(-150,Math.min(0,hdn.s0+dx));hb.style.transform='translateX('+slid+'px)';}});

// キーボード
const KD=new Set();
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;
 if(mode==='aim'){if(e.code==='ArrowLeft'||e.code==='KeyA'){AIM.f+=1;AIM.d=((Math.round(AIM.f)%72)+72)%72;e.preventDefault();}
  if(e.code==='ArrowRight'||e.code==='KeyD'){AIM.f-=1;AIM.d=((Math.round(AIM.f)%72)+72)%72;e.preventDefault();}
  if((e.code==='ArrowUp'||e.code==='KeyW')&&!charge){AIM.c=(AIM.c+4)%5;ls.set('sg_club',AIM.c);drawClubs();e.preventDefault();}
  if((e.code==='ArrowDown'||e.code==='KeyS')&&!charge){AIM.c=(AIM.c+1)%5;ls.set('sg_club',AIM.c);drawClubs();e.preventDefault();}
  if(/^Digit[1-5]$/.test(e.code)&&!charge){AIM.c=+e.code.slice(5)-1;ls.set('sg_club',AIM.c);drawClubs();}
  if(e.code==='Space'&&!e.repeat&&e.isTrusted){e.preventDefault();ac();charge={t0:performance.now()};}}
 else if(e.code==='Space')e.preventDefault();});
addEventListener('keyup',e=>{if(e.code==='Space'&&mode==='aim'&&charge){const p=powerNow();charge=null;doShot(p);}});

 el.style.left=clamp((p.x*.5+.5)*innerWidth,60,innerWidth-60)+'px';el.style.top=clamp((-p.y*.5+.5)*innerHeight,70,innerHeight-20)+'px';}

 {const cl=SG.CLUBS[AIM.c];const m=AIM.c===0?cl[3]*cl[3]/(2*SG.DECEL):cl[3]*cl[3]*2*cl[1]*cl[2]/SG.G;$('dist').hidden=false;$('dist').textContent=t('clubs')[AIM.c]+'　'+t('maxd',{m:Math.round(m)});}

let swingT=-1;
function doShot(p){
 if(mode!=='aim')return;
 AIM.p=p;mode='shot';setUI('shot');aimArrow.visible=false;swingT=0;SFX.swing();
 orbReset();lastEvT=0;G.t0=performance.now();G.P0=SG.shot(AIM.c,AIM.d,p,0);G.in=AIM.c+'.'+AIM.d+'.'+p;G.P=null;G.wait=true;
 setTimeout(()=>SFX.hit(AIM.c),0);
 takeTicket(G.in).then(st=>{if(mode!=='shot'||G.P)return;const el=(performance.now()-G.t0)/1000;
  if(typeof st==='number'){const P=SG.shot(AIM.c,AIM.d,p,SG.seedOf(st));if(P.te>el+.03){G.st=st;useP(P);return;}}
  fallback(el);});
}
function fallback(el){if(G.P)return;let P=null;for(let i=0;i<60;i++){const q=SG.shot(AIM.c,AIM.d,AIM.p,(Math.random()*4294967296)>>>0);if(q.te>el+.03){P=q;break;}if(!P||q.te>P.te)P=q;}G.offline=true;useP(P);}
function useP(P){G.P=P;G.wait=false;setPlan(P,{b:G.b});lastEvT=Math.min(lastEvT,(performance.now()-G.t0)/1000);}
function doBreak(){
 if(mode!=='shot'||G.b!=null)return;const el=(performance.now()-G.t0)/1000;
 if(G.P&&el>G.P.T-.3)return;
 G.b=el;if(G.P)G.P.o.b=el;SFX.snap();hb.classList.add('done');$('ctrl').hidden=true;bigText(t('snapTxt'),null,1300);G.pipFirst=true;ORB.on=false;
}
let lastEvT=0;
function playEv(P,t0,t1){for(const e of P.ev)if(e.t>t0&&e.t<=t1)(SFX[e.s]||(()=>{}))();
 const b=P.o&&P.o.b;if(b!=null){if(P.T>t0&&P.T<=t1)SFX.clink();if(P.T+1.4>t0&&P.T+1.4<=t1)SFX.splash();}else if(P.T>t0&&P.T<=t1)SFX.cup();}
function shotFrame(dt,now){
 const ts=(now-G.t0)/1000;
 const tt=ts;
 // 部長の打った後の構え
 const D=aimDir();const sw=swingT>=0?Math.min(1,swingT/.25):1;swingT+=dt;
 placeMe(D[0],D[1],G.b!=null?0:lerp(-.3-(AIM.p/100)*(AIM.c===0?.9:2.1),AIM.c===0?.7:1.9,ease(sw)),G.b!=null);
 if(!G.P){
  const b=physPos(G.P0,ts);ball.position.copy(b);ball.scale.setScalar(.06);placeBoss('nervous',now/1000);
  const phEnd=G.P0.tl;if(ts>phEnd-.05||ts>4)fallback(ts);
  camForShot(G.P0,ts,{ball:ball.position,cup:V3(CUP.x,0,CUP.z),phase:'fly'},dt,1);
  $('hudTime').textContent=ts.toFixed(2);ballGlow.visible=true;ballGlow.position.set(b.x,.02,b.z);ballGlow.scale.setScalar(1+Math.max(0,b.y)*.05);
  return;}
 const P=G.P;if(G.b!=null)P.o.b=G.b;
 const out=sceneAt(P,ts);playEv(P,lastEvT,ts);lastEvT=ts;
 placeBoss(ts<P.T?'nervous':'freeze',now/1000,P);
 const bv=breakView(P,ts,G.b);
 if(!(bv&&bv.pip))G.swap=false;
 const swp=bv&&bv.pip&&G.swap;
 const dtc=G.snapCam?5:dt;G.snapCam=false;
 if(bv&&!swp)camGo(bv.pos,bv.look,dtc,bv.pip&&ts>G.b+1.5?3:5);else camForShot(P,ts,out,dtc,1);camShake=out.shake||0;
 if(bv&&bv.pip){$('pip').hidden=false;$('pipLbl').hidden=false;const lb=(swp?t('pipMe'):t('pipLbl'))+'<br><small>'+esc(t('pipTap'))+'</small>';if($('pipLbl').innerHTML!==lb)$('pipLbl').innerHTML=lb;
  if(swp){const a=G.pipFirst?1:1-Math.exp(-dt*5);pipP.lerp(bv.pos,a);pipL.lerp(bv.look,a);pipCam.position.copy(pipP);pipCam.lookAt(pipL);}else pipFollow(P,ts,dt,G.pipFirst);G.pipFirst=false;G.pipOn=true;}
 else if(G.pipOn){$('pip').hidden=true;$('pipLbl').hidden=true;G.pipOn=false;}
 ballGlow.visible=ts<P.T;ballGlow.position.set(out.ball.x,.02,out.ball.z);ballGlow.scale.setScalar(1+Math.max(0,out.ball.y)*.05);
 $('hudTime').textContent=Math.min(ts,P.T).toFixed(2);
 const [rs,rb]=reasonTxt(P.ri);
 if(ts>=P.capT&&ts<P.T+1.5)capText(rs);else capText('');
 if(out.actVis&&ts>=P.capT&&ts<Math.min(P.T,P.capT+2.5)&&!bv)bub('act',rb,out.act,ACT&&ACT.kind==='veh'?2.8:ACT&&ACT.air?1.6:1.9);else bubs.act.hidden=true;
 if(ts<P.T&&bossCut(P,ts)&&!bv&&!ORB.on){const il=t('idle');bub('boss',il[P.ri%il.length],boss.man.position);}else bubs.boss.hidden=true;
 if(ts>=P.T){
  if(G.b!=null){if(ts>=P.T+.05&&!G.clinkShown){G.clinkShown=1;bigText(t('clink'),null,1300);}if(ts>=P.T+1.4&&!G.pondShown){G.pondShown=1;bigText(t('pond'));sendYuzu();}
   if(ts>=P.T+2.6)startMV();}
  else{$('pip').hidden=true;$('pipLbl').hidden=true;G.res={kind:'win',ms:P.ms,ri:P.ri};markSeen(P.ri);submit();mode='after';G.afterT=0;$('ctrl').hidden=true;SFX.cup();bigText(t('cupIn'));}
 }
}

function makeClock(T,b){let K=[[0,3],[Math.max(0,T-6),T]];if(b!=null)K.push([Math.max(0,b-.5),Math.min(T,b+2.6)]);K.sort((x,y)=>x[0]-y[0]);const M=[];for(const k of K){if(M.length&&k[0]<=M[M.length-1][1])M[M.length-1][1]=Math.max(M[M.length-1][1],k[1]);else M.push(k.slice());}
 const S=[];let pos=0;for(let i=0;i<M.length;i++){if(i>0){const g0=M[i-1][1],g1=M[i][0];if(g1>g0){const d=Math.min(g1-g0,Math.max(1,(g1-g0)/6));S.push({r0:pos,r1:pos+d,t0:g0,t1:g1,ff:true});pos+=d;}}S.push({r0:pos,r1:pos+(M[i][1]-M[i][0]),t0:M[i][0],t1:M[i][1],ff:false});pos+=M[i][1]-M[i][0];}
 return {len:pos,at(r){for(const x of S)if(r<x.r1)return {t:x.t0+(x.t1-x.t0)*Math.max(0,r-x.r0)/Math.max(1e-6,x.r1-x.r0),ff:x.ff};return {t:T+(r-pos),ff:false};}};}
function playClock(T,real){return makeClock(T,null).at(real);}
function playLen(T){return makeClock(T,null).len;}

function wrapTxt(g,s,x,y,maxW,lh,txt){let line='',yy=y;for(const ch of s){if(g.measureText(line+ch).width>maxW&&line){txt(line,x,yy);line='';yy+=lh;}line+=ch;}if(line)txt(line,x,yy);}

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>接待ゴルフ</title>
<meta name="description" content="最終ホール。部長に勝たせないといけないのに、どう打っても入ってしまう。">
<meta property="og:title" content="接待ゴルフ">
<meta property="og:description" content="最終ホール。部長に勝たせないといけないのに、どう打っても入ってしまう。">
<meta property="og:image" content="https://nasubi-no-oniwa.github.io/settai-golf/ogp.png">

<style>
:root{--bg:#9fd3f5;--ink:#1d1d1d;--sub:#666;--accent:#1f8a4c;--red:#d8352a;--warn:#ffcc00;--ok:#1aa34a;--card:#fffdf6}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#pad{position:fixed;inset:0;z-index:3;touch-action:none}
#hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 6px);text-align:center;z-index:4;pointer-events:none}
#hudTitle{font-size:12px;font-weight:900;color:#fffe;text-shadow:0 1px 2px #0009}
#hudTime{font-size:38px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 #0006,0 0 8px #0005;line-height:1.1}
#hudBest{font-size:11px;color:#fffe;text-shadow:0 1px 2px #0009;font-variant-numeric:tabular-nums}
#ff{display:inline-block;margin-top:4px;background:#000a;color:#ffdd55;font-weight:900;font-size:14px;padding:3px 10px;border-radius:99px}
#cap{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 92px);text-align:center;z-index:4;pointer-events:none;font-size:19px;font-weight:900;color:#fff;text-shadow:0 2px 0 #000a,0 0 8px #0008;line-height:1.35}
#cap.pop{animation:pop .45s ease-out}
#big{position:fixed;left:0;right:0;top:36%;text-align:center;font-size:50px;font-weight:900;color:#fff;text-shadow:0 4px 0 #0006,0 0 14px #0007;z-index:7;pointer-events:none;line-height:1.15;padding:0 10px}
#big small{display:block;font-size:20px;margin-top:6px}
#big.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(1.6);opacity:0}60%{transform:scale(.95);opacity:1}100%{transform:scale(1)}}
#pip{position:fixed;left:calc(env(safe-area-inset-left,0px) + 10px);top:calc(env(safe-area-inset-top,0px) + 132px);width:132px;height:132px;border-radius:50%;border:4px solid #fff;box-shadow:0 3px 10px #0006;z-index:6;background:#9fd3f5;cursor:pointer;touch-action:none}
#pipLbl{position:fixed;left:calc(env(safe-area-inset-left,0px) + 6px);top:calc(env(safe-area-inset-top,0px) + 272px);width:140px;line-height:1.3;text-align:center;z-index:5;font-weight:900;font-size:12px;color:#fff;text-shadow:0 1px 2px #000c;pointer-events:none}
#freeze{position:fixed;inset:0;pointer-events:none;z-index:2;background:#2a5a9a;opacity:0;transition:opacity .6s}
.bub{position:fixed;z-index:5;pointer-events:none;transform:translate(-50%,-100%);background:#fff;border:3px solid #1d1d1d;border-radius:14px;padding:4px 10px;font-weight:900;font-size:15px;white-space:nowrap;box-shadow:0 3px 0 #0003}
.bub:after{content:'';position:absolute;left:50%;bottom:-11px;margin-left:-7px;border:7px solid transparent;border-top-color:#1d1d1d}
.bub.boss{background:#fff4cc}
#clubs{position:fixed;left:50%;transform:translateX(-50%);max-width:98vw;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:6;display:flex;gap:5px}
#clubs button{white-space:nowrap;border:3px solid #1d1d1d;border-radius:10px;background:#fffdf6;font:900 12px "Hiragino Maru Gothic ProN",system-ui,sans-serif;padding:7px 6px;color:#1d1d1d;box-shadow:0 3px 0 #0004}
#clubs button.on{background:var(--accent);color:#fff}
#dist{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 56px);text-align:center;z-index:4;pointer-events:none;color:#fff;font-weight:900;font-size:13px;text-shadow:0 1px 2px #000b}
#gauge{position:fixed;left:calc(env(safe-area-inset-left,0px) + 18px);top:28%;height:42%;width:30px;border:3px solid #1d1d1d;border-radius:16px;background:#fffd;z-index:6;overflow:hidden;box-shadow:0 3px 0 #0004}
#gaugeFill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#e8352a,#ffcc00 45%,#1aa34a)}
#gaugeTxt{position:fixed;left:calc(env(safe-area-inset-left,0px) + 6px);top:calc(28% - 24px);width:54px;text-align:center;z-index:6;font-weight:900;font-size:15px;color:#fff;text-shadow:0 1px 2px #000b;font-variant-numeric:tabular-nums}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);text-align:center;font-size:12px;color:#fff;text-shadow:0 1px 2px #000c;z-index:4;pointer-events:none;padding:0 150px 0 70px;line-height:1.5}
#ctrl{position:fixed;right:calc(env(safe-area-inset-right,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 30px);width:112px;height:112px;z-index:6}
#subBtn{position:absolute;inset:6px;border-radius:50%;border:3px dashed #2a2a2a;background:#e9e2cf;color:#2a2a2a;font:900 13px "Hiragino Maru Gothic ProN",system-ui,sans-serif;line-height:1.2;cursor:pointer;padding:0;box-shadow:inset 0 4px 10px #0004}
#subBtn.brk{background:#f2d27a}
#hitBtn{position:absolute;inset:0;border-radius:50%;border:0;background:var(--accent);color:#fff;font:900 20px "Hiragino Maru Gothic ProN",system-ui,sans-serif;cursor:pointer;box-shadow:0 5px 0 #0d4a27,0 0 0 5px #fffd;touch-action:none;padding:0;line-height:1.2}
#hitBtn.hold{transform:translateY(3px);box-shadow:0 2px 0 #0d4a27,0 0 0 5px #fffd}
#hitBtn.done{background:#8aa898;font-size:15px}
#skipBtn{position:fixed;right:calc(env(safe-area-inset-right,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 12px);z-index:9;border:none;border-radius:99px;background:#000b;color:#fff;font:800 14px "Hiragino Maru Gothic ProN",system-ui,sans-serif;padding:8px 14px}
.panel{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#0006;padding:14px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:18px;max-width:380px;width:100%;text-align:center;max-height:100%;overflow:auto;box-shadow:0 8px 0 #0004}
.card h1{margin:0 0 6px;font-size:30px;line-height:1.25}
.card h1 em{font-style:normal;color:var(--accent)}
.card h1 small{display:block;font-size:13px;color:var(--sub);margin-top:2px}
.card h2{margin:0 0 6px;font-size:22px}
.card p{margin:8px 0;line-height:1.6;font-size:14px;color:var(--sub)}
.card button{display:block;width:100%;margin-top:9px;padding:13px;border:none;border-radius:12px;font-size:17px;font-weight:800;font-family:inherit;background:var(--accent);color:#fff;cursor:pointer}
.card button.sub{background:#ece7da;color:var(--ink);font-size:15px}
.card button.x{background:#000;color:#fff}
.card button:disabled{opacity:.45}
.card input{width:100%;font-size:16px;border-radius:10px;border:2px solid #ccc;padding:9px;font-family:inherit;margin-top:6px}
.row{display:flex;gap:8px}.row button{flex:1}
#langs{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}
#langs button{width:auto;flex:none;padding:6px 10px;font-size:13px;margin:0;background:#eee;color:var(--ink)}
#langs button.on{background:var(--ink);color:#fff}
.bigNum{font-size:44px;font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.1}
.bigNum small{font-size:18px}
.mid{font-size:19px;font-weight:900}
.note{font-size:13px;min-height:1.3em}
.note.err{color:#d23}.note.ok{color:var(--ok)}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{flex:1;margin:0;padding:9px;font-size:15px;background:#eee;color:var(--ink)}
.tabs button.on{background:var(--ink);color:#fff}
table.rank{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.rank td{padding:6px 3px;border-bottom:1px solid #eee;text-align:left}
table.rank td.r{color:var(--accent);font-weight:900;width:2.2em}
table.rank td.n{max-width:8em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.rank td.c{text-align:right;font-weight:900}
table.rank td.p button{margin:0;padding:4px 7px;font-size:12px;width:auto;background:#eee;color:var(--ink)}
table.rank tr.me td{background:#fff2c4}
table.rank tr.top td{background:#e6f7ea;font-weight:900}
table.rank tr.kubi td{background:#fde8e6;font-weight:900}
table.rank tr.kubi td.r{color:var(--red);font-size:11px;white-space:nowrap}
#rankBox{max-height:52vh;overflow:auto}
#vidPrev{width:100%;max-height:46vh;object-fit:contain;background:#000;border-radius:10px;display:block}
#recBadge{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);z-index:12;background:#d23;color:#fff;font-weight:900;padding:6px 14px;border-radius:999px;font-size:14px}
#replayBar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);z-index:9;display:flex;gap:8px;align-items:center;background:#000c;color:#fff;padding:8px 10px 8px 14px;border-radius:999px;font-weight:800;font-size:14px;white-space:nowrap;max-width:94vw}
#replayBar span{overflow:hidden;text-overflow:ellipsis}
#replayBar button{border:none;border-radius:999px;padding:7px 12px;font-weight:800;font-family:inherit;background:#fff;color:#000}
</style>
<!-- nasubi-track: 結果画面とXへの投稿の回数を記録（ゲームの動きには影響しない） -->
<script>(function(){try{var G="settai-golf",IDS=["result"];
function ev(n){try{if(typeof gtag==='function')gtag('event',n,{game:G});}catch(e){}}
var o=window.open;window.open=function(u){try{if(/intent\/(post|tweet)/.test(String(u)))ev('x_share');}catch(e){}return o.apply(window,arguments);};
if(!IDS.length)return;
function vis(e){if(!e||!e.isConnected||e.closest('[hidden]'))return false;var r=e.getBoundingClientRect();if(r.width<1||r.height<1)return false;for(var n=e;n&&n.nodeType===1;n=n.parentElement){var s=getComputedStyle(n);if(s.display==='none'||s.visibility==='hidden'||parseFloat(s.opacity)<0.05)return false;}return true;}
var was={};setInterval(function(){try{var any=false;for(var i=0;i<IDS.length;i++){if(vis(document.getElementById(IDS[i])))any=true;}if(any&&!was.v)ev('result_view');was.v=any;}catch(e){}},700);
}catch(e){}})();</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="freeze"></div>
<canvas id="pip" width="264" height="264" hidden></canvas><div id="pipLbl" hidden></div>
<div id="pad"></div>
<div id="hud" hidden><div id="hudTitle"></div><div id="hudTime">0.00</div><div id="hudBest"></div><div id="ff" hidden></div></div>
<div id="cap"></div>
<div id="big"></div>
<div id="bubBoss" class="bub boss" hidden></div>
<div id="bubAct" class="bub" hidden></div>
<div id="clubs" hidden></div>
<div id="dist" hidden></div>
<div id="gauge" hidden><div id="gaugeFill"></div></div>
<div id="gaugeTxt" hidden></div>
<div id="hint" hidden></div>
<div id="ctrl" hidden>
 <button id="subBtn" tabindex="-1"></button>
 <button id="hitBtn" tabindex="-1"></button>
</div>
<button id="skipBtn" hidden></button>
<div id="recBadge" hidden></div>
<div id="replayBar" hidden><span id="replayTxt"></span><button id="replayBack"></button></div>

<div class="panel" id="title" hidden>
 <div class="card">
  <h1 id="tTitle"></h1>
  <p id="tHow"></p>
  <input id="nameIn" maxlength="12" autocomplete="off">
  <p class="note" id="tBest"></p>
  <button id="startBtn"></button>
  <button class="sub" id="rankBtn"></button>
  <div id="langs"></div>
 </div>
</div>

<div class="panel" id="result" hidden>
 <div class="card">
  <h2 id="rHead"></h2>
  <div class="bigNum" id="rTime"></div>
  <div class="mid" id="rGrade"></div>
  <p class="note" id="rNote"></p>
  <input id="rName" maxlength="12" autocomplete="off" hidden>
  <button class="sub" id="renameBtn" hidden></button>
  <p class="note" id="sendMsg"></p>
  <button id="againBtn"></button>
  <button class="x" id="vidBtn"></button>
  <button class="x" id="xBtn"></button>
  <div class="row"><button class="sub" id="rRank"></button><button class="sub" id="rTop"></button></div>
 </div>
</div>

<div class="panel" id="vidPanel" hidden>
 <div class="card">
  <h2 id="vTitle"></h2>
  <video id="vidPrev" playsinline muted loop controls></video>
  <p class="note" id="vMsg"></p>
  <button id="vShare"></button>
  <button class="sub" id="vSave"></button>
  <button class="x" id="vX"></button>
  <button class="sub" id="vBack"></button>
 </div>
</div>

<div class="panel" id="rankPanel" hidden>
 <div class="card">
  <h2 id="rkTitle"></h2>
  <div class="tabs"><button id="tabDay"></button><button id="tabAll"></button></div>
  <p style="font-size:12px;margin:0 0 6px" id="rkNote"></p>
  <div id="rankBox"></div>
  <button class="sub" id="rankBack"></button>
 </div>
</div>

<script src="sim.js"></script>
